name: release
# 打 v* 标签即发布：先跑测试，再并行
#   (1) GoReleaser 构建多平台二进制并上传到 GitHub Release；
#   (2) 镜像按架构拆成并行 job（amd64 → ubuntu-latest，arm64 → 原生 ubuntu-24.04-arm，避免 QEMU 模拟），
#       各自按 digest 推送 GHCR，最后合成多架构 manifest：ghcr.io/<owner>/bepusdt:{version,major.minor,latest,sha}
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Go vet & race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: Checkout theme smoke test
        run: node scripts/checkout-smoke.mjs

  binaries:
    name: Binaries & GitHub Release
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Build frontend
        working-directory: ./web
        run: |
          pnpm install --frozen-lockfile --shamefully-hoist
          pnpm run build:prod
      - name: Embed frontend
        run: |
          mkdir -p static/secure
          cp -r web/dist/* static/secure/
      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image ${{ matrix.platform }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve names
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bepusdt" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=manual-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Pre-pull buildkit image
        # setup-buildx 需要从 Docker Hub 拉 buildkit 镜像，偶发连接重置会直接让整个 job 失败；
        # 先带退避重试拉好，之后 setup-buildx 直接使用本地镜像
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "pull buildkit failed, retry $i"
            sleep $((i * 10))
          done
          exit 1
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Multi-arch manifest
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve names
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bepusdt" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Pre-pull buildkit image
        # setup-buildx 需要从 Docker Hub 拉 buildkit 镜像，偶发连接重置会直接让整个 job 失败；
        # 先带退避重试拉好，之后 setup-buildx 直接使用本地镜像
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "pull buildkit failed, retry $i"
            sleep $((i * 10))
          done
          exit 1
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=,format=short
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
